name: Generate Android Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate release keystore and credentials
        shell: bash
        run: |
          set -euo pipefail

          KEY_ALIAS="svgvectorconverter"

          # Generate strong random passwords locally on the ephemeral runner.
          KEYSTORE_PASSWORD="$(openssl rand -base64 32 | tr -d '\n')"
          KEY_PASSWORD="$(openssl rand -base64 32 | tr -d '\n')"

          # Mask passwords immediately so accidental echoes will be redacted.
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          keytool -genkeypair             -v             -keystore svg-vector-converter-release.jks             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS"             -keypass "$KEY_PASSWORD"             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=SVG Vector Converter, OU=Release, O=SVG Vector Converter, L=Unknown, ST=Unknown, C=US"

          # Base64 form for the GitHub Actions repository secret.
          base64 -w 0 svg-vector-converter-release.jks > keystore-base64.txt

          # Put the credentials in the artifact rather than workflow logs.
          {
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } > release-signing-credentials.txt

          chmod 600             svg-vector-converter-release.jks             keystore-base64.txt             release-signing-credentials.txt

          # Sanity-check the generated keystore before uploading anything.
          keytool -list             -keystore svg-vector-converter-release.jks             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS"             >/dev/null

          echo "Release keystore generated and verified."

      - name: Create checksum
        shell: bash
        run: |
          sha256sum svg-vector-converter-release.jks > svg-vector-converter-release.jks.sha256

      - name: Upload one-time signing bundle
        uses: actions/upload-artifact@v4
        with:
          name: SvgVectorConverter-release-signing-bundle
          path: |
            svg-vector-converter-release.jks
            svg-vector-converter-release.jks.sha256
            keystore-base64.txt
            release-signing-credentials.txt
          if-no-files-found: error
          retention-days: 1
