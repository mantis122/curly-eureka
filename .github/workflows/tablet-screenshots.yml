name: Capture Tablet Store Screenshots

on:
  workflow_dispatch:

jobs:
  capture:
    name: 7-inch and 10-inch tablet screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare tablet capture script
        shell: bash
        run: |
          cat > tablet_capture.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -eu

          mkdir -p tablet-screenshots

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "No debug APK found."
            exit 1
          fi

          BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"
          PACKAGE="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          ACTIVITY="$("$AAPT" dump badging "$APK" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" | head -n 1)"

          if [[ -z "$PACKAGE" || -z "$ACTIVITY" ]]; then
            echo "Could not determine package or launch activity."
            exit 1
          fi

          echo "Installing: $APK"
          adb install -r "$APK"

          # Put the showcase SVG where Android's document picker can see it.
          #
          # On the GitHub emulator the ordinary "shell" user can sometimes see
          # /sdcard but receives EACCES when traversing /storage/emulated/0.
          # google_apis emulator images are rootable, so restart adbd as root,
          # wait for it to reconnect, then create/populate Downloads.
          echo "Preparing shared Downloads storage..."
          adb root >/dev/null 2>&1 || true
          adb wait-for-device

          # Give Android a moment to finish reconnecting storage services after
          # adbd restarts.
          sleep 3

          adb shell mkdir -p /storage/emulated/0/Download
          adb shell chmod 0777 /storage/emulated/0/Download || true

          adb push svg_vector_converter_showcase.svg /storage/emulated/0/Download/01_mountain.svg
          adb shell chmod 0666 /storage/emulated/0/Download/01_mountain.svg || true

          # Verify before continuing so a storage problem fails here with useful
          # diagnostics instead of later in the document picker.
          adb shell ls -l /storage/emulated/0/Download/01_mountain.svg

          adb shell am broadcast \
            -a android.intent.action.MEDIA_SCANNER_SCAN_FILE \
            -d file:///storage/emulated/0/Download/01_mountain.svg >/dev/null 2>&1 || true

          adb_wait() {
            local tries=0
            until adb shell true >/dev/null 2>&1; do
              tries=$((tries + 1))
              if [[ $tries -ge 30 ]]; then
                echo "ADB did not recover."
                return 1
              fi
              sleep 2
            done
          }

          tap_text() {
            local wanted="$1"
            local tries=0
            while [[ $tries -lt 20 ]]; do
              # Dump the accessibility hierarchy to /data/local/tmp rather
              # than /sdcard. After `adb root`, shared-storage access can be
              # restricted even though ordinary device input still works.
              adb shell uiautomator dump /data/local/tmp/window.xml >/dev/null 2>&1 || true
              adb pull /data/local/tmp/window.xml window.xml >/dev/null 2>&1 || true

              coords="$(python3 - "$wanted" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          wanted = sys.argv[1]
          try:
              root = ET.parse('window.xml').getroot()
          except Exception:
              sys.exit(1)
          for node in root.iter('node'):
              text = (node.attrib.get('text') or '').strip()
              desc = (node.attrib.get('content-desc') or '').strip()
              if text == wanted or desc == wanted:
                  m = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds',''))
                  if m:
                      x1,y1,x2,y2 = map(int,m.groups())
                      print((x1+x2)//2, (y1+y2)//2)
                      sys.exit(0)
          sys.exit(1)
          PY
              )" || true

              if [[ -n "$coords" ]]; then
                read -r x y <<< "$coords"
                echo "Tapping '$wanted' at $x,$y"
                adb shell input tap "$x" "$y"
                return 0
              fi
              tries=$((tries + 1))
              sleep 1
            done
            echo "Could not find UI text: $wanted"
            echo "--- Current foreground activity ---"
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
            echo "--- UI hierarchy text/content descriptions ---"
            adb shell uiautomator dump /data/local/tmp/window.xml >/dev/null 2>&1 || true
            adb pull /data/local/tmp/window.xml window.xml >/dev/null 2>&1 || true
            python3 - <<'PY' || true
import xml.etree.ElementTree as ET
try:
    root = ET.parse("window.xml").getroot()
    for node in root.iter("node"):
        text = (node.attrib.get("text") or "").strip()
        desc = (node.attrib.get("content-desc") or "").strip()
        if text or desc:
            print("text=%r desc=%r bounds=%s" % (
                text, desc, node.attrib.get("bounds", "")
            ))
except Exception as e:
    print("Could not parse UI hierarchy:", e)
PY
            return 1
          }

          open_showcase() {
            adb shell am force-stop "$PACKAGE"
            adb shell am start -W -n "$PACKAGE/$ACTIVITY" >/dev/null
            sleep 3

            tap_text "OPEN SVG"
            sleep 3

            # The Android document picker normally opens in Recents. Navigate to
            # Downloads explicitly so the workflow is deterministic.
            if tap_text "Show roots"; then
              sleep 1
            else
              # Some picker versions expose the hamburger only by description.
              adb shell input tap 48 72
              sleep 1
            fi

            tap_text "Downloads" || true
            sleep 2
            tap_text "01_mountain.svg"

            # Conversion is intentionally given extra time because optimization
            # is the longest stage on this app.
            sleep 10
          }

          capture_size() {
            local label="$1"
            local width="$2"
            local height="$3"
            local density="$4"

            echo "=== Capturing $label ($width x $height @ $density dpi) ==="
            adb_wait
            adb shell wm size "${width}x${height}"
            adb shell wm density "$density"
            adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
            adb shell settings put system user_rotation 0 >/dev/null 2>&1 || true
            sleep 2

            open_showcase
            sleep 2

            local output="tablet-screenshots/${label}-mountain-preview.png"
            adb exec-out screencap -p > "$output"
            file "$output"
          }

          # One emulator, two sequential captures. This avoids the intermittent
          # emulator/ADB broken-pipe failures seen when the tablet jobs booted
          # independently.
          capture_size "7-inch" 1080 1920 240
          capture_size "10-inch" 1440 2560 240

          echo "Finished tablet screenshots:"
          ls -lh tablet-screenshots
          SCRIPT

          chmod +x tablet_capture.sh

      - name: Capture both tablet screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
          script: bash tablet_capture.sh

      - name: Upload tablet screenshots
        uses: actions/upload-artifact@v4
        with:
          name: svg-vector-converter-tablet-store-screenshots
          path: tablet-screenshots/*.png
          if-no-files-found: error
