name: Capture Tablet Store Screenshots

on:
  workflow_dispatch:

jobs:
  capture:
    name: Capture tablet showcase screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

          echo "KVM device:"
          ls -l /dev/kvm || true

          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM is accessible."
          else
            echo "KVM is not accessible; emulator may fall back to slow software emulation."
          fi

      - name: Prepare tablet capture scripts
        shell: bash
        run: |
          cat > find_ui.py <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET

          if len(sys.argv) < 3:
              raise SystemExit("usage: find_ui.py <text|--dump> <xml-file>")

          wanted = sys.argv[1]
          xml_file = sys.argv[2]

          try:
              root = ET.parse(xml_file).getroot()
          except Exception as exc:
              print(f"Could not parse UI hierarchy: {exc}", file=sys.stderr)
              raise SystemExit(1)

          if wanted == "--dump":
              for node in root.iter("node"):
                  text = (node.attrib.get("text") or "").strip()
                  desc = (node.attrib.get("content-desc") or "").strip()
                  if text or desc:
                      print(
                          f"text={text!r} desc={desc!r} "
                          f"bounds={node.attrib.get('bounds', '')}"
                      )
              raise SystemExit(0)

          for node in root.iter("node"):
              text = (node.attrib.get("text") or "").strip()
              desc = (node.attrib.get("content-desc") or "").strip()
              if text == wanted or desc == wanted:
                  match = re.match(
                      r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",
                      node.attrib.get("bounds", ""),
                  )
                  if match:
                      x1, y1, x2, y2 = map(int, match.groups())
                      print((x1 + x2) // 2, (y1 + y2) // 2)
                      raise SystemExit(0)

          raise SystemExit(1)
          PY

          cat > tablet_capture.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -eu

          mkdir -p tablet-screenshots

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "No debug APK found."
            exit 1
          fi

          if [[ ! -f svg_vector_converter_showcase.svg ]]; then
            echo "Missing svg_vector_converter_showcase.svg at repository root."
            exit 1
          fi

          echo "Installing: $APK"
          adb install -r "$APK"

          BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"

          PACKAGE="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          ACTIVITY="$("$AAPT" dump badging "$APK" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" | head -n 1)"

          if [[ -z "$PACKAGE" || -z "$ACTIVITY" ]]; then
            echo "Could not determine package or launch activity."
            exit 1
          fi

          echo "Package: $PACKAGE"
          echo "Activity: $ACTIVITY"

          echo "Preparing shared Downloads storage..."
          adb root >/dev/null 2>&1 || true
          adb wait-for-device
          sleep 3

          adb shell mkdir -p /storage/emulated/0/Download
          adb shell chmod 0777 /storage/emulated/0/Download || true
          adb push svg_vector_converter_showcase.svg /storage/emulated/0/Download/01_mountain.svg
          adb shell chmod 0666 /storage/emulated/0/Download/01_mountain.svg || true
          adb shell ls -l /storage/emulated/0/Download/01_mountain.svg

          adb shell am broadcast \
            -a android.intent.action.MEDIA_SCANNER_SCAN_FILE \
            -d file:///storage/emulated/0/Download/01_mountain.svg >/dev/null 2>&1 || true

          tap_text() {
            local wanted="$1"
            local tries=0
            local coords=""

            while [[ $tries -lt 20 ]]; do
              adb shell uiautomator dump /data/local/tmp/window.xml >/dev/null 2>&1 || true
              adb pull /data/local/tmp/window.xml window.xml >/dev/null 2>&1 || true

              coords="$(python3 find_ui.py "$wanted" window.xml 2>/dev/null || true)"
              if [[ -n "$coords" ]]; then
                read -r x y <<< "$coords"
                echo "Tapping '$wanted' at $x,$y"
                adb shell input tap "$x" "$y"
                return 0
              fi

              tries=$((tries + 1))
              sleep 1
            done

            echo "Could not find UI text: $wanted"
            echo "--- Current foreground activity ---"
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
            echo "--- UI hierarchy text/content descriptions ---"
            adb shell uiautomator dump /data/local/tmp/window.xml >/dev/null 2>&1 || true
            adb pull /data/local/tmp/window.xml window.xml >/dev/null 2>&1 || true
            python3 find_ui.py --dump window.xml || true
            return 1
          }

          open_showcase() {
            adb shell am force-stop "$PACKAGE"
            adb shell am start -W -n "$PACKAGE/$ACTIVITY" >/dev/null
            sleep 4

            tap_text "OPEN SVG"
            sleep 3

            # Open the DocumentsUI roots drawer by tapping its actual toolbar
            # button. Do NOT use a left-edge swipe here: on gesture-navigation
            # builds that gesture is Android "Back" and closes the picker.
            echo "Opening DocumentsUI roots drawer..."
            if ! tap_text "Show roots"; then
              echo "Accessibility tap for Show roots failed; trying toolbar coordinates..."
              adb shell input tap 66 84
            fi
            sleep 2

            # Verify that the drawer really opened. If not, tap the known center
            # of the Show-roots button once more, then require Downloads.
            if ! tap_text "Downloads"; then
              echo "Downloads not visible; retrying Show roots at 66,84..."
              adb shell input tap 66 84
              sleep 2
              tap_text "Downloads"
            fi

            sleep 3
            tap_text "01_mountain.svg"
            sleep 10
          }

          capture_size() {
            local label="$1"
            local width="$2"
            local height="$3"
            local density="$4"

            echo "=== Capturing $label ($width x $height @ $density dpi) ==="

            adb shell wm size "${width}x${height}"
            adb shell wm density "$density"
            sleep 3

            open_showcase

            local output="tablet-screenshots/${label}-mountain-preview.png"
            adb exec-out screencap -p > "$output"
            file "$output"
          }

          capture_size "7-inch" 1080 1920 240
          capture_size "10-inch" 1440 2560 240

          echo "Tablet screenshots created:"
          ls -lh tablet-screenshots
          SCRIPT

          chmod +x tablet_capture.sh

      - name: Capture tablet screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
          script: bash tablet_capture.sh

      - name: Upload tablet screenshots
        uses: actions/upload-artifact@v4
        with:
          name: svg-vector-converter-tablet-store-screenshots
          path: tablet-screenshots/*.png
          if-no-files-found: error
