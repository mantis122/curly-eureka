name: Capture Tablet Screenshots

on:
  workflow_dispatch:

jobs:
  capture:
    name: ${{ matrix.label }} tablet
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 7-inch
            width: 1080
            height: 1920
            density: 240
          - label: 10-inch
            width: 1440
            height: 2560
            density: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare tablet capture script
        shell: bash
        run: |
          cat > tablet_capture.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -eu

          LABEL="$1"
          WIDTH="$2"
          HEIGHT="$3"
          DENSITY="$4"

          mkdir -p tablet-screenshots

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "No debug APK found."
            exit 1
          fi

          echo "Installing: $APK"
          adb install -r "$APK"

          BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"

          PACKAGE="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          ACTIVITY="$("$AAPT" dump badging "$APK" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" | head -n 1)"

          if [[ -z "$PACKAGE" || -z "$ACTIVITY" ]]; then
            echo "Could not determine package or launch activity."
            exit 1
          fi

          echo "Package: $PACKAGE"
          echo "Activity: $ACTIVITY"

          adb shell wm size "${WIDTH}x${HEIGHT}"
          adb shell wm density "$DENSITY"

          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 0 || true

          adb shell am force-stop "$PACKAGE"
          adb shell am start -W -n "$PACKAGE/$ACTIVITY"

          sleep 4

          OUTPUT="tablet-screenshots/${LABEL}-startup.png"
          adb exec-out screencap -p > "$OUTPUT"

          echo "Captured $LABEL screenshot:"
          file "$OUTPUT"
          SCRIPT

          chmod +x tablet_capture.sh

      - name: Capture ${{ matrix.label }} screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
          script: bash tablet_capture.sh "${{ matrix.label }}" "${{ matrix.width }}" "${{ matrix.height }}" "${{ matrix.density }}"

      - name: Upload ${{ matrix.label }} screenshot
        uses: actions/upload-artifact@v4
        with:
          name: svg-vector-converter-${{ matrix.label }}-tablet-screenshot
          path: tablet-screenshots/${{ matrix.label }}-startup.png
          if-no-files-found: error
